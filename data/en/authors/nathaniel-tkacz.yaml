bio: "Nate Tkacz is a Professor of Digital Media and Culture. His broad interest is in understanding how digital technologies produce or (re)shape culture and society. He has approached this interest in a number of ways, for example, through a study of how digital networks change the conditions of knowledge production (through studies of Wikipedia or dashboard interfaces), or through studies of how apps transform our relationship to money and finance (banking apps), or governance and health (covid apps). His research aims to combine critical and technical understandings of media with creative methodological approaches."
