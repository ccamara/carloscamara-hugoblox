# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://docs.hugoblox.com/reference/language/

# Default language
es:
  locale: es-es
  # Uncomment for multi-lingual sites, and move English content into `en` sub-folder.
  contentDir: content/es
  permalinks:
      page:
        blog: /blog/:year/:month/:slug/
      section:
        blog: /blog/
  menu:
    main:
      - name: Inicio
        url: '#about'
        weight: 1
      - name: Sobre mi
        url: '/experience'
        weight: 2
      - name: Publicaciones
        url: '#papers'
        weight: 3
      - name: Eventos
        url: '#events'
        weight: 4
      - name: Blog
        url: '#blog'
        weight: 5



# Uncomment the lines below to configure your website in a second language.
en: 
  locale: en-GB
  contentDir: content/en
  permalinks:
      page:
        blog: /blog/:year/:month/:slug/
      section:
        blog: /blog/
  menu:
    main:
    - name: Home
      url: '/#about'
      weight: 1
    - name: About me
      url: '/experience'
      weight: 2
    - name: Publications
      url: '/#papers'
      weight: 3
    - name: Events
      url: '/#events'
      weight: 4
    - name: Projects
      url: '/projects'
      weight: 5
    - name: Blog
      url: '/#blog'
      weight: 6
    # - name: Courses
    #   url: '/courses'
    #   weight: 10
