<!-- Implements Bonfire's telling widget. Documentation: https://bonfirenetworks.org/telling/-->

{{ if site.Params.hugoblox.comments.bonfire}}
{{ $config := site.Params.hugoblox.comments.bonfire }}
<!-- Add the Telling to any page -->

<div class="bonfire-comments">

  <script
    src="{{ $config.instance }}/js/comments_embed.js/"
    data-theme="{{$config.theme}}"
    data-mode="{{$config.mode}}"
    async
  ></script>

  <noscript>Please enable JavaScript to view the <a href="https://bonfirenetworks.org/telling/">comments powered by Bonfire.</a></noscript>
  <a href="https://bonfirenetworks.org/telling/">comments powered by 🔥 Bonfire</a>

</div>

{{end}}
